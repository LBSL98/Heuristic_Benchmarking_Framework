schema: forja-exp-v1
experiment_id: tcc-phase1-baselines
description: 'Official phase-1 baseline campaign for the canonical thesis portfolio.
  This plan contains only METIS and KaHIP under the fair(time) protocol.

  '
solvers:
  metis:
    enabled: true
    k: 8
    budget:
      type: time
      seconds: 5
    params: {}
  kahip:
    enabled: true
    k: 8
    imbalance: 0.03
    budget:
      type: time
      seconds: 5
    params:
      preset: fast
  sa:
    enabled: false
  ils:
    enabled: false
  grasp:
    enabled: false
  ts:
    enabled: false
rng:
  seeds:
  - 42
instances:
  base_dir: data/instances
  include:
  - synthetic/n2000_p50.json.gz
  - synthetic/modnull_n3000_p50.json.gz
  - synthetic/modnull_n3500_p40.json.gz
  - synthetic/mix_betas_n3000_p35_cv045.json.gz
  - synthetic/n4000_cv_high.json.gz
  - synthetic/n5000_cv_low.json.gz
  - synthetic/wilson_tree_n10000.json.gz
  - synthetic/n2000_dense_fast.json.gz
  - real/roadnet/roadnet_ca_bfs_10000_seed42.json.gz
  - real/roadnet/roadnet_ca_bfs_20000_seed43.json.gz
  - real/snap/ca_hepth_gcc.json.gz
  - real/snap/ca_astroph_gcc.json.gz
  manifest_out: data/results_raw/main_baselines/manifest_index.csv
  fields:
  - filename
  - n
  - m
  - density
  - cv_degree
output:
  raw_dir: data/results_raw/main_baselines
