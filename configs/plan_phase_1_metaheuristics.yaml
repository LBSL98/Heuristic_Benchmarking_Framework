schema: forja-exp-v1
experiment_id: tcc-phase1-metaheuristics
description: 'Official phase-1 metaheuristic campaign for the canonical thesis portfolio.
  This plan contains SA, ILS, GRASP, and TS under the fair(time) protocol.

  '
solvers:
  metis:
    enabled: false
  kahip:
    enabled: false
  sa:
    enabled: true
    k: 8
    imbalance: 0.03
    budget:
      type: time
      seconds: 5
    params:
      initial_temp: 1.0
      cooling: 0.997
      min_temp: 0.001
      max_steps: 100000
      checkpoint_every_nfe: 100
  ils:
    enabled: true
    k: 8
    imbalance: 0.03
    budget:
      type: time
      seconds: 5
    params:
      max_iters: 100
      perturb_moves: 4
      checkpoint_every_iter: 1
  grasp:
    enabled: true
    k: 8
    imbalance: 0.03
    budget:
      type: time
      seconds: 5
    params:
      alpha: 0.3
      max_iters: 100
      checkpoint_every_iter: 1
  ts:
    enabled: true
    k: 8
    imbalance: 0.03
    budget:
      type: time
      seconds: 5
    params:
      max_steps: 10000
      min_tenure: 7
      tenure_scale: 1.0
      tenure_jitter: 4
      checkpoint_every_nfe: 100
      frequency_penalty: 0.01
rng:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
instances:
  base_dir: data/instances/synthetic
  include:
  - n2000_p50.json.gz
  - modnull_n3000_p50.json.gz
  - modnull_n3500_p40.json.gz
  - mix_betas_n3000_p35_cv045.json.gz
  - n4000_cv_high.json.gz
  - n5000_cv_low.json.gz
  - wilson_tree_n10000.json.gz
  - n2000_dense_fast.json.gz
  manifest_out: data/results_raw/main_metaheuristics/manifest_index.csv
  fields:
  - filename
  - n
  - m
  - density
  - cv_degree
output:
  raw_dir: data/results_raw/main_metaheuristics
