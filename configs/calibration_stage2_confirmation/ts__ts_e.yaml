schema: forja-exp-v1
experiment_id: calib-stage2-ts-ts_e
solvers:
  ts:
    enabled: true
    k: 8
    imbalance: 0.03
    budget:
      type: time
      seconds: 5
    params:
      max_steps: 10000
      min_tenure: 7
      tenure_scale: 1.5
      tenure_jitter: 6
      checkpoint_every_nfe: 100
      frequency_penalty: 0.01
instances:
  base_dir: data/instances/synthetic
  include:
  - n2000_p50.json.gz
  - modnull_n3000_p50.json.gz
  - mix_betas_n3000_p35_cv045.json.gz
  - n4000_cv_high.json.gz
  - n5000_cv_low.json.gz
  - wilson_tree_n10000.json.gz
  manifest_out: data/results_raw/calibration_stage2_confirmation/ts/ts_e/manifest_index.csv
rng:
  seeds:
  - 42
  - 43
  - 44
  - 45
  - 46
output:
  raw_dir: data/results_raw/calibration_stage2_confirmation/ts/ts_e
