schema: forja-exp-v1
experiment_id: calib-stage1-smoke-ils-ils_a
solvers:
  ils:
    enabled: true
    k: 8
    imbalance: 0.03
    budget:
      type: time
      seconds: 5
    params:
      max_iters: 100
      perturb_moves: 2
      checkpoint_every_iter: 1
instances:
  base_dir: data/instances/synthetic
  include:
  - n2000_p50.json.gz
  manifest_out: data/results_raw/calibration_stage1_smoke/ils/ils_a/manifest_index.csv
rng:
  seeds:
  - 42
output:
  raw_dir: data/results_raw/calibration_stage1_smoke/ils/ils_a
