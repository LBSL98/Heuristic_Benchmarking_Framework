schema: forja-exp-v1
experiment_id: calib-stage1-smoke-ts-ts_a
solvers:
  ts:
    enabled: true
    k: 8
    imbalance: 0.03
    budget:
      type: time
      seconds: 5
    params:
      max_steps: 10000
      min_tenure: 5
      tenure_scale: 1.0
      tenure_jitter: 4
      checkpoint_every_nfe: 100
      frequency_penalty: 0.0
instances:
  base_dir: data/instances/synthetic
  include:
  - n2000_p50.json.gz
  manifest_out: data/results_raw/calibration_stage1_smoke/ts/ts_a/manifest_index.csv
rng:
  seeds:
  - 42
output:
  raw_dir: data/results_raw/calibration_stage1_smoke/ts/ts_a
