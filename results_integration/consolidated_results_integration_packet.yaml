safe_claims_pt_br:
- A campanha dedicada em srv-noctua produziu 22.400 resultados válidos, sem resultados inválidos, sob o protocolo confirmatório
  registrado.
- Nas fatias confirmadas, a modelagem CART foi aceita como análise diagnóstica interpretável, com acurácia balanceada LOSO
  de 0,8311 e SGKF de 0,7817.
- No grafo TigerLine de Los Angeles County, METIS/gpmetis obteve corte menor que KaHIP/kaffpa fast em quatro dos cinco valores
  de k avaliados e empatou em k=16; essa evidência é limitada a uma única instância real.
forbidden_claims_pt_br:
- Não afirmar que o CART é um seletor universal de algoritmos.
- Não afirmar dominância geral de METIS, KaHIP ou meta-heurísticas a partir do TigerLine.
- Não afirmar que SNAP foi licenciado ou resolvido.
- Não combinar evidência local, WSL e srv-noctua como se pertencessem ao mesmo ambiente experimental.
- Não usar TigerLine isoladamente para treinar CART ou sustentar conclusão multi-dataset.
