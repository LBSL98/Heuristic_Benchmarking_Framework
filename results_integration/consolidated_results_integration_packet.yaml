    monograph_safe_text_pt_br: Neste grafo real TigerLine de Los Angeles County, com 1.199.509 vértices e 1.294.674 arestas
      observadas, METIS/gpmetis obteve corte menor que KaHIP/kaffpa fast em k=2, k=4, k=8 e k=32, enquanto houve empate em
      k=16. As diferenças absolutas de corte foram pequenas no contexto do número total de arestas, variando de 0 a 37 arestas.
      Esse resultado é evidência limitada a uma instância real e a duas configurações de solvers; ele não sustenta, isoladamente,
      uma conclusão geral sobre dominância de famílias de algoritmos, nem treinamento CART.
