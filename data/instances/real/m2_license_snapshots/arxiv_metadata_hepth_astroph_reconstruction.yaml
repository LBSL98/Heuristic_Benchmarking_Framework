license:
  expected_name: "Creative Commons Universal (CC0 1.0) Public Domain Declaration"
  scope: "descriptive metadata only"
  license_url: "https://creativecommons.org/publicdomain/zero/1.0/"
  evidence_summary:
    - "The 1016 probe found arXiv API Terms of Use text stating that descriptive metadata about arXiv e-prints may be used under CC0 1.0."
    - "The same evidence distinguishes metadata from e-prints, PDFs, source files and full text."
    - "The bulk data page points users to Terms of Use for arXiv APIs before using metadata or full-text access options."
  restrictions_or_boundaries:
    - "Do not treat full text, PDFs, source files or e-prints as covered by this metadata-only decision."
