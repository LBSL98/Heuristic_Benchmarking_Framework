    - "abstract"
    - "authors"
    - "identifiers"
    - "categories/classification terms"
    - "dates"
  excluded_inputs:
    - "full-text PDFs"
    - "source files"
    - "e-print content"
  required_review_before_admission:
    - "Define exact category filters for HEP-TH/ASTRO-PH-like reconstruction."
