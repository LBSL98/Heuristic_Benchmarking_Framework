    - "verify sha256 after download"
    - "extract only to ignored local cache paths"
    - "read road geometries without committing raw or extracted shapefile contents"
    - "emit metadata and validation summaries separately from derived graph artifacts"
    - "fail closed if source URL, filename, hash policy or expected layer identity changes"
