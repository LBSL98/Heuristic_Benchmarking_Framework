    - "running meta-heuristics"
    - "training CART"

planned_graph_construction_method:
  graph_type: "undirected_unweighted_simple_graph"
  source_geometry_type: "road polylines from TIGER/Line ROADS shapefile"
  selected_interpretation: "segment_vertex_graph_from_polyline_coordinate_sequences"
  node_interpretation:
    - "Each unique normalized coordinate vertex appearing in road polyline coordinate sequences becomes a candidate graph node."
    - "Coordinate normalization and precision policy must be explicitly fixed in the later implementation gate."
    - "No semantic node labels from the source file are assumed by this plan."
  edge_interpretation:
    - "Each consecutive pair of coordinate vertices in a road polyline contributes an undirected candidate edge."
    - "Self-loops are removed."
    - "Parallel duplicate edges are collapsed for the unweighted simple graph."
    - "No length, road class or direction weight is admitted in the first preparation plan."
  intersection_policy:
    - "This plan does not infer intersection nodes from geometric crossings unless a shared coordinate vertex exists."
    - "A later graph-construction gate may compare this conservative policy with explicit planarization, but planarization is not admitted here."
  disconnected_components_policy:
    - "Retain the full graph for metadata review."
    - "Record number of connected components, largest component size, isolated nodes and component-size distribution."
    - "Do not discard components unless a later benchmark-input gate explicitly decides so."
  projection_policy:
    undirected_projection_selected_for_initial_plan: true
    directed_or_weighted_graph_selected: false
    rationale: "The current benchmark interface expects an undirected graph-partitioning input; weights and directionality remain later extensions."

