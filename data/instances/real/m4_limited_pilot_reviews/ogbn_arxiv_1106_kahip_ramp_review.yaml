review_decision:
  decision_label: "admit_ogbn_arxiv_calibrated_campaign_command_plan_only"
  rationale:
    - "The 1099B limited pilot validated METIS on ogbn-arxiv and showed that a 5000 ms KaHIP budget was insufficient."
    - "The 1106 KaHIP ramp showed that KaHIP completed successfully for all tested larger budgets."
    - "All three KaHIP ramp budgets converged to the same cutsize_best under the tested seed and preset."
    - "A 30000 ms KaHIP budget is a conservative bounded choice for the next ogbn-arxiv command-plan gate because the observed runtime was about 9.3 seconds in all ramp runs."
    - "The evidence supports preparing an ogbn-arxiv calibrated campaign command plan, but it still does not authorize execution, CART training or result claims."
  admitted_next_scope: "bounded_ogbn_arxiv_calibrated_campaign_command_plan"
  calibrated_multilevel_participants:
    - "metis"
    - "kahip"
  metis_reference_budget_time_ms: 5000
  kahip_recommended_budget_time_ms: 30000
  kahip_reference_cutsize_best: 361338
  kahip_reference_elapsed_ms_range:
    min: 9326
    max: 9334
  participant_set_must_be_decided_in_command_plan: true
  non_multilevel_participants_require_command_plan_preflight: true
  full_campaign_command_plan_admitted: true
  full_campaign_execution_admitted: false
  full_campaign_execution_requires_later_gate: true
  cart_training_admitted: false
  redistribution_allowed: false
  raw_files_committable: false
  derived_files_committable: false
  local_pilot_outputs_committable: false
  monograph_result_claim_supported: false

required_next_step:
