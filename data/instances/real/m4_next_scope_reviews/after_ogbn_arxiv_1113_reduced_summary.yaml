decision:
  label: "close_ogbn_arxiv_as_bounded_validation_and_select_next_admissible_real_graph"
  rationale:
    - "The ogbn-arxiv path now has a reduced summary record derived from a versioned review manifest."
    - "The artifact is sufficient for execution-path validation and wiring validation."
    - "It is not sufficient for multi-dataset campaign conclusions, CART training, solver dominance claims, or monograph result claims."
    - "Broader ogbn-arxiv participant expansion would increase scope before the real-graph admissibility set is resolved."
    - "A multi-dataset command plan should wait until the next admissible real graph is selected under explicit license/admissibility constraints."
  chosen_next_scope: "select_next_license_admissible_real_graph_gate"
  ogbn_arxiv_status_after_decision: "complete_as_bounded_validation_artifact"
  broaden_ogbn_arxiv_now: false
  admit_ogbn_arxiv_broader_participant_preflight_now: false
  admit_multi_dataset_command_plan_now: false
  admit_cart_training_now: false
