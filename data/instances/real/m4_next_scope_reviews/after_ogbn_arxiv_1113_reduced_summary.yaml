  admit_result_map_updates_now: false
  admit_raw_or_derived_graph_commits_now: false
  admit_raw_solver_output_commits_now: false
  allow_snap_unresolved_datasets: false

required_next_gate:
  purpose: "Select the next real graph candidate with clear admissibility before any broader execution."
  must_define:
    - "candidate dataset id"
    - "license family"
    - "source URL or source package identity"
    - "citation or attribution requirement"
    - "redistribution policy"
    - "whether repository stores only scripts/metadata or can store derived summaries"
    - "whether raw or derived graph files remain local-only"
    - "benchmark input preparation plan"
    - "smoke or limited-pilot command plan before any full campaign"
  candidate_constraints:
    - "Do not use unresolved SNAP datasets unless an explicit dataset-specific license/admissibility record exists."
    - "Prefer datasets with clear terms, citation and attribution requirements."
    - "If uncertainty remains, store scripts, hashes and metadata rather than redistributing graph files."
    - "Do not train CART from ogbn-arxiv alone."
    - "Do not write monograph result claims from ogbn-arxiv alone."

blocked_until_later_gate:
  - "multi-dataset command plan"
  - "full campaign execution"
  - "broader ogbn-arxiv participant expansion"
  - "CART training"
  - "result-map updates"
  - "monograph claims"
  - "raw solver output commits"
  - "partition file commits"
  - "raw graph commits"
  - "derived graph commits"
  - "unresolved SNAP dataset execution"

interpretation_boundary:
  supported:
    - "ogbn-arxiv execution wiring was validated for METIS and KaHIP under bounded calibrated settings."
    - "The reduced summary is a traceable single-dataset validation artifact."
  unsupported:
    - "multi-dataset comparative conclusion"
    - "general METIS dominance claim"
    - "CART gatekeeper admissibility"
    - "monograph result claim"
